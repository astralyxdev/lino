name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a dry run (nothing is published)"
        required: true
        default: v0.0.0-dryrun

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: COMMIT=$(git rev-parse --short HEAD) ./scripts/dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lino-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  install-test:
    needs: build
    uses: ./.github/workflows/install.yml
    with:
      artifact: lino-${{ github.event_name == 'push' && github.ref_name || inputs.version }}

  publish:
    needs: [build, install-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lino-${{ github.ref_name }}
          path: dist
      - name: verify checksums
        run: cd dist && sha256sum -c checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
